plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sparta'
version = '0.0.1-SNAPSHOT'

springBoot {
	mainClass = 'com.sparta.auth_service.AuthServiceApplication'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2025.1.2")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('bootRun') {
	def envFile = file('.env')
	if (envFile.exists()) {
		envFile.readLines().each { line ->
			if (line.trim() && !line.trim().startsWith('#') && line.contains('=')) {
				def parts = line.split('=', 2)
				environment parts[0].trim(), parts[1].trim()
			}
		}
	}
}

tasks.register('generateJwtKeys') {
	group = 'setup'
	description = 'Generates RSA JWT key pair (keys/jwt-private.pem, keys/jwt-public.pem)'

	doLast {
		def keysDir = layout.projectDirectory.dir('keys').asFile
		keysDir.mkdirs()

		def privateKeyFile = new File(keysDir, 'jwt-private.pem')
		def publicKeyFile = new File(keysDir, 'jwt-public.pem')

		if (privateKeyFile.exists() || publicKeyFile.exists()) {
			throw new GradleException(
					'JWT keys already exist in keys/. Delete jwt-private.pem and jwt-public.pem to regenerate.'
			)
		}

		def keyPairGenerator = java.security.KeyPairGenerator.getInstance('RSA')
		keyPairGenerator.initialize(2048)
		def keyPair = keyPairGenerator.generateKeyPair()

		privateKeyFile.text = toPrivateKeyPem(keyPair.private.encoded)
		publicKeyFile.text = toPublicKeyPem(keyPair.public.encoded)

		logger.lifecycle('Generated keys/jwt-private.pem and keys/jwt-public.pem')
		logger.lifecycle('Auth-service uses jwt-private.pem. Copy jwt-public.pem path to gateway JWT_PUBLIC_KEY_LOCATION.')
	}
}

static String toPrivateKeyPem(byte[] encoded) {
	def body = java.util.Base64.getMimeEncoder(64, '\n'.bytes).encodeToString(encoded)
	return "-----BEGIN PRIVATE KEY-----\n${body}\n-----END PRIVATE KEY-----\n"
}

static String toPublicKeyPem(byte[] encoded) {
	def body = java.util.Base64.getMimeEncoder(64, '\n'.bytes).encodeToString(encoded)
	return "-----BEGIN PUBLIC KEY-----\n${body}\n-----END PUBLIC KEY-----\n"
}
