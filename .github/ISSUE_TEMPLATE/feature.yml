name: Feature
description: 새로운 기능을 추가합니다.
title: "[Feature] "
labels:
  - Feature

body:
  - type: textarea
    id: description
    attributes:
      label: 설명
      description: 새로운 기능에 대해 설명해주세요.
      placeholder: 자세히 적을수록 좋습니다.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 작업할 내용
      description: 할 일을 체크박스 형태로 작성해주세요.
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: 참고 자료
      description: 관련 문서나 링크가 있다면 작성해주세요.
      placeholder: https://..., Figma, Notion 등
