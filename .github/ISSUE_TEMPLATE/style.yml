name: Style
description: UI 및 스타일을 수정합니다.
title: "[Style] "
labels:
  - Style

body:
  - type: textarea
    id: description
    attributes:
      label: 변경 내용
      description: 변경하려는 UI 또는 스타일을 작성해주세요.
      placeholder: 예) 버튼 색상 변경, 레이아웃 수정, 반응형 개선
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 작업할 내용
      description: 작업할 내용을 체크박스 형태로 작성해주세요.
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: 참고 자료
      description: 디자인 시안, Figma, 스크린샷 등이 있다면 작성해주세요.
      placeholder: Figma 링크, 이미지, 참고 사이트 등