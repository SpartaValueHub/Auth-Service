spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

jwt:
  access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
  refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:14}
  private-key: ${JWT_PRIVATE_KEY:}
  private-key-location: ${JWT_PRIVATE_KEY_LOCATION:}

auth:
  cookie:
    access-name: ${AUTH_COOKIE_ACCESS_NAME:vh_access_token}
    refresh-name: ${AUTH_COOKIE_REFRESH_NAME:vh_refresh_token}
    path: ${AUTH_COOKIE_PATH:/}
    domain: ${AUTH_COOKIE_DOMAIN:}
    secure: ${AUTH_COOKIE_SECURE:false}
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}

portone:
  api-secret: ${PORTONE_API_SECRET}
  base-url: ${PORTONE_BASE_URL:https://api.portone.io}
