spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

captcha:
  recaptcha:
    allowed-hostnames: test.localhost,127.0.0.1
    challenge-max-age-seconds: 120
